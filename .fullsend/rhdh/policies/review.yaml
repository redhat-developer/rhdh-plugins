---
version: 1

# Sandbox policy for the review agent.
#
# Forked from fullsend-ai/agents policies/review.yaml so we can allowlist
# Claude Code's bun binary (claude.exe). **/claude does not match claude.exe,
# which is what 2.1+ uses to call sts.googleapis.com for Vertex.
#
# Read-only agent: needs GitHub API (gh pr view, gh pr diff, gh issue view)
# and Vertex AI for inference. No write access to GitHub — the post-script
# handles mutations on the runner with a separate write-scoped token.

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: "api.anthropic.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "*.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: "**/claude"
      - path: "**/claude.exe"
      - path: "**/node"

  github_api:
    name: github-api
    endpoints:
      - host: "api.github.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      # gh CLI uses POST /graphql for reads; protocol: graphql allows
      # queries but blocks mutations at the AST level
      - host: "api.github.com"
        port: 443
        protocol: graphql
        enforcement: enforce
        access: read-only
        path: "/graphql"
      - host: "github.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: "**/gh"
      - path: "**/node"
