---
version: 1

# Read-only policy for CI diagnosis. GitHub writes happen only in the
# host-side post-script after schema validation and a fresh head check.
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: '*.googleapis.com'
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: '**/claude'
      - path: '**/claude.exe'
      - path: '**/node'

  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: '**/curl'
      - path: '**/gh'
      - path: '**/git'
      - path: '**/node'
