---
version: 1

# The repair sandbox can build and test, but GitHub remains read-only. The
# validated host-side post-script performs the only push.
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: '*.googleapis.com'
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: '**/claude'
      - path: '**/claude.exe'
      - path: '**/node'

  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: '**/curl'
      - path: '**/gh'
      - path: '**/git'
      - path: '**/node'
      - path: '**/pre-commit'

  package_registries:
    name: package-registries
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
        allow_encoded_slash: true
      - host: registry.yarnpkg.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: proxy.golang.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: sum.golang.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: '**/npm'
      - path: '**/npx'
      - path: '**/yarn'
      - path: '**/yarnpkg'
      - path: '**/pnpm'
      - path: '**/node'
      - path: '**/pip'
      - path: '**/pip3'
      - path: '**/python'
      - path: '**/python3'
      - path: '**/python3.*'
      - path: '**/go'
      - path: '**/pre-commit'
