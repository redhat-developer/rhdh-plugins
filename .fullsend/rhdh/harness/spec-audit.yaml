# Run an advisory OpenSpec artifact audit on a GitHub pull request.
#
# The review base supplies the read-only sandbox and token. Custom scripts
# prepare the PR head and publish an audit comment without changing reviews.

base: https://raw.githubusercontent.com/fullsend-ai/agents/93c69826f40bd14c8c40dc5797bd7d9ef5a8b748/harness/review.yaml#sha256=3e9302d8143fcfd93df8e4542162776e98893c8ef367450679e2ffa89e5b0c53

agent: rhdh/agents/spec-audit.md
model: claude-opus-4-6
image: ghcr.io/redhat-developer/rhdh-fullsend-code:latest

pre_script: rhdh/scripts/pre-spec-audit.sh
post_script: rhdh/scripts/post-spec-audit.sh

validation_loop:
  script: rhdh/scripts/validate-spec-audit.py
  schema: rhdh/schemas/spec-audit-result.schema.json
  max_iterations: 2

skills:
  - https://github.com/redhat-developer/rhdh-skills/tree/a7632c8d2e696cc7489fc1a226db674efe57ccc6/skills/refinement/openspec-audit-change#sha256=2d07301c96882e0da0061bac6fc3f171e9169c97e4d402b2a0822b854d47ecc9

allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/
  - https://github.com/redhat-developer/rhdh-skills/
allow_runtime_fetch: true

host_files:
  - src: dispatch/event-payload.json
    dest: /sandbox/workspace/.fullsend-event.json
    optional: true
  # Variable paths are checked after the pre-script creates this file.
  - src: ${RUNNER_TEMP}/spec-audit-context.json
    dest: /sandbox/workspace/.spec-audit-context.json

# Custom harnesses use the generic matrix job, whose PR context is exposed as
# GITHUB_ISSUE_URL + ISSUE_NUMBER. Adapt those values to the stock review
# harness contract. Fullsend mints REVIEW_TOKEN from role: review at run time.
env:
  runner:
    TARGET_REPO_DIR: '${TARGET_REPO_DIR}'
    SPEC_AUDIT_CONTEXT_FILE: '${RUNNER_TEMP}/spec-audit-context.json'
    PRIOR_REVIEW_SHA: ''
    PRIOR_REVIEW_PROVENANCE: 'none'
  sandbox:
    ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
    TIMEOUT_SECONDS: '1800'
    PRIOR_REVIEW_SHA: ''
    PRIOR_REVIEW_PROVENANCE: 'none'

forge:
  github:
    host_files:
      # Generic command dispatch exposes GITHUB_ISSUE_URL, not GITHUB_PR_URL.
      # Replace the stock review env file at the same destination.
      - src: rhdh/env/spec-audit.env
        dest: /sandbox/workspace/.env.d/review.env
    env:
      runner:
        REVIEW_TOKEN: '${REVIEW_TOKEN}'
        PR_NUMBER: '${ISSUE_NUMBER}'
        PR_URL: '${GITHUB_ISSUE_URL}'
        GH_TOKEN: '${GH_TOKEN}'
        FULLSEND_FORGE: github
        REVIEW_RISK_ASSESSMENT_ENABLED: 'false'
      sandbox:
        PR_NUMBER: '${ISSUE_NUMBER}'
        PR_URL: '${GITHUB_ISSUE_URL}'
        GH_TOKEN: '${GH_TOKEN}'
        FULLSEND_FORGE: github
        REVIEW_RISK_ASSESSMENT_ENABLED: 'false'

timeout_minutes: 30

trigger: >
  event.source.system == "github"
    && has(event.state.change_proposal)
    && event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-spec"
    && (event.transition.comment.body == "/fs-spec audit"
      || event.transition.comment.body.startsWith("/fs-spec audit ")
      || event.transition.comment.body.startsWith("/fs-spec audit\n"))
