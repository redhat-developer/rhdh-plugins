base: https://raw.githubusercontent.com/fullsend-ai/agents/41f89529863ea6c26e804a348f56953423d294a3/harness/fix.yaml#sha256=41344ad24d492eaa3824cfca4d13d3799c091fa2271b9c54326efadb12e33785
agent: rhdh/agents/fix.md
image: ghcr.io/redhat-developer/rhdh-fullsend-code:0.57.1
policy: rhdh/policies/ci-fix.yaml
role: coder
slug: fullsend-ai-ci-repair

providers:
  - github-artifacts
openshell:
  profiles:
    - profiles/fullsend-github-artifacts.yaml

skills:
  - https://github.com/redhat-developer/rhdh-skills/tree/e84109919ae6085e3dcfe568c695e6dda54874ce/skills/rhdh-coding#sha256=5a4bc35476108a215091ccf1180cee68547c7668c6b193de4402674bc7b6cded
  - skills/ci-repair
  - skills/ci-failure-analysis
  - skills/playwright-trace
allowed_remote_resources:
  - https://github.com/redhat-developer/rhdh-skills/

host_files:
  - src: rhdh/env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /tmp/.gcp-oidc-token
    optional: true
  - src: rhdh/bin/yarn
    dest: /sandbox/workspace/bin/yarn
  - src: rhdh/env/yarn-proxy.env
    dest: /sandbox/workspace/.env.d/yarn-proxy.env
  - src: dispatch/event-payload.json
    dest: /sandbox/workspace/ci-event.json
    optional: true

pre_script: rhdh/scripts/pre-ci-fix.sh
post_script: rhdh/scripts/post-ci-fix.sh
validation_loop:
  script: rhdh/scripts/validate-output-schema.sh
  schema: rhdh/schemas/ci-fix-result.schema.json
  max_iterations: 2

env:
  runner:
    GH_TOKEN: ${GH_TOKEN}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
    CI_CONTEXT_FILE: ${GITHUB_WORKSPACE}/.fullsend/dispatch/event-payload.json
  sandbox:
    GH_TOKEN: ${GH_TOKEN}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
    CI_EVENT_FILE: /sandbox/workspace/ci-event.json
    CI_REPAIR_MODE: 'true'
    PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers

timeout_minutes: 60

forge:
  github:
    # Override the inherited GitHub forge scripts as well as the root scripts.
    # Fullsend applies forge.github settings after the base harness.
    pre_script: rhdh/scripts/pre-ci-fix.sh
    post_script: rhdh/scripts/post-ci-fix.sh
