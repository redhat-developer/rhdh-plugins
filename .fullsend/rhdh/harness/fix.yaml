# Pinned to agents@v0.45.0 (commit 93c69826f), matching the fullsend@v0.45.0
# CLI our own .github/workflows/fullsend.yaml pins — these are companion
# releases cut together, so this is the harness content the installed CLI
# was actually built and tested against.
base: https://raw.githubusercontent.com/fullsend-ai/agents/93c69826f40bd14c8c40dc5797bd7d9ef5a8b748/harness/fix.yaml#sha256=20741c3ef52e41f4a5e5a78b02a91859b9300172798eea3dd448896b1f369066
agent: rhdh/agents/fix.md
image: ghcr.io/redhat-developer/rhdh-fullsend-code:latest
# policy: inherited from base (policies/base.yaml + openshell providers/
# profiles for vertex-ai, package-registries, gitleaks and, via the github
# forge overlay, github-code). Our former rhdh/policies/code.yaml fork
# existed only to allowlist the claude.exe binary for Vertex;
# profiles/fullsend-vertex-ai.yaml now does that upstream (ADR 0065's
# provider/profile network policy migration).
skills:
  - https://github.com/redhat-developer/rhdh-skills/tree/e84109919ae6085e3dcfe568c695e6dda54874ce/skills/rhdh-coding#sha256=5a4bc35476108a215091ccf1180cee68547c7668c6b193de4402674bc7b6cded
# Harness-level allowlist required for URL skills (not inherited from base or
# config.yaml). Must also be covered by config.yaml allowed_remote_resources.
allowed_remote_resources:
  - https://github.com/redhat-developer/rhdh-skills/
host_files:
  - src: rhdh/bin/yarn
    dest: /sandbox/workspace/bin/yarn
  - src: rhdh/env/yarn-proxy.env
    dest: /sandbox/workspace/.env.d/yarn-proxy.env
