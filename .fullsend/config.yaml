# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
# The reusable workflow overlays upstream defaults onto the standard layered
# directories before every run. Keep repo-owned agents under rhdh/ so their
# harnesses and resources remain intact.
agents:
    - name: triage
      source: rhdh/harness/triage-jira.yaml
    - name: code
      source: rhdh/harness/code.yaml
    - name: fix
      source: rhdh/harness/fix.yaml
    - name: review
      source: rhdh/harness/review.yaml
    # CVE dependency-bump assessment (RHIDP-17209). Trigger: cve-fix label
    # or /fs-cve-pr-review on a PR. Posts advisory PASS/FAIL/PARTIAL; no merge.
    - name: cve-reviewer
      source: rhdh/harness/cve-review.yaml
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://github.com/redhat-developer/rhdh-skills/
    # Temporary pin host for cve-pr-review until the skill lands on
    # redhat-developer/rhdh-skills (JessicaJHee/rhdh-skills @ 9668bfa).
    - https://github.com/JessicaJHee/rhdh-skills/
create_issues:
    allow_targets:
        repos:
            - redhat-developer/rhdh-plugins
            - fullsend-ai/fullsend
