name: Create backport pull requests

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: backport-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  add-backport-label:
    name: Add backport label from comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Add requested release labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const command =
              /(?:^|\n)\s*\/backport\s+(release-(?:(?:[2-9]|[1-9]\d+)\.\d+|1\.(?:9|10)\/[A-Za-z0-9._-]+))\s*$/gm;
            const labels = [...context.payload.comment.body.matchAll(command)].map(
              match => `backport-${match[1]}`,
            );
            const uniqueLabels = [...new Set(labels)];

            if (uniqueLabels.length === 0) {
              core.info('No backport command found in the comment.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: uniqueLabels,
            });
            core.info(`Added labels: ${uniqueLabels.join(', ')}`);

  backport:
    name: Backport merged pull request
    if: github.event.pull_request.merged == true && github.repository == 'redhat-developer/rhdh-plugins'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create backport pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          pr_number=$(jq -r '.pull_request.number' "$EVENT_PATH")
          pr_title=$(jq -r '.pull_request.title' "$EVENT_PATH")
          pr_url=$(jq -r '.pull_request.html_url' "$EVENT_PATH")

          source_commits=()
          while IFS= read -r source_commit; do
            source_commits+=("$source_commit")
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/commits" \
              --jq '.[].sha' \
              | tac
          )

          if [[ ${#source_commits[@]} -eq 0 ]]; then
            echo "No commits found for pull request #$pr_number." >&2
            exit 1
          fi

          labels=()
          while IFS= read -r label; do
            labels+=("$label")
          done < <(
            jq -r '.pull_request.labels[].name' "$EVENT_PATH" \
              | grep -E '^backport-release-(([2-9]|[1-9][0-9]+)\.[0-9]+|1\.(9|10)/[A-Za-z0-9._-]+)$' \
              | sort -u
          )

          if [[ ${#labels[@]} -eq 0 ]]; then
            echo 'No backport-release-x.y labels found; nothing to do.'
            exit 0
          fi

          git config user.name 'rhdh-bot'
          git config user.email 'rhdh-bot@redhat.com'
          git fetch origin --prune

          cleanup_branch() {
            if [[ -n "${body_file:-}" ]]; then
              rm -f "$body_file"
            fi
            if [[ "${branch_pushed:-false}" == true ]]; then
              echo "Removing orphaned backport branch '$backport_branch'." >&2
              git push origin --delete "$backport_branch" || true
            fi
          }

          for label in "${labels[@]}"; do
            release_branch="${label#backport-}"
            backport_branch="backport/${pr_number}-to-${release_branch}"

            if ! git ls-remote --exit-code origin "refs/heads/$release_branch" >/dev/null; then
              echo "Release branch '$release_branch' does not exist; skipping '$label'." >&2
              continue
            fi

            if git ls-remote --exit-code origin "refs/heads/$backport_branch" >/dev/null; then
              existing_pr=$(gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --head "$backport_branch" \
                --base "$release_branch" \
                --state all \
                --json number \
                --jq '.[0].number // empty')
              if [[ -n "$existing_pr" ]]; then
                echo "Backport PR #$existing_pr already exists for '$release_branch'; skipping."
              else
                echo "Branch '$backport_branch' already exists without a backport PR; refusing to overwrite." >&2
                exit 1
              fi
              continue
            fi

            git switch --detach "origin/$release_branch"
            git switch --create "$backport_branch"

            branch_pushed=false
            body_file=''
            trap cleanup_branch EXIT

            for source_commit in "${source_commits[@]}"; do
              git fetch origin "$source_commit"
              git cherry-pick "$source_commit"
            done

            git push --set-upstream origin "$backport_branch"
            branch_pushed=true

            body_file=$(mktemp)
            printf '%s\n\nSource pull request: %s\nTarget release branch: `%s`\n\nPlease resolve any conflicts and complete the normal review before merging.\n' \
              "This pull request was created automatically from #${pr_number}." \
              "$pr_url" \
              "$release_branch" > "$body_file"

            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$release_branch" \
              --head "$backport_branch" \
              --title "Backport #${pr_number}: ${pr_title}" \
              --body-file "$body_file" \
              --label "$label"

            rm -f "$body_file"
            body_file=''
            branch_pushed=false
            trap - EXIT
            git switch --detach "origin/main"
            git branch --delete --force "$backport_branch"
          done
