# Poll RHIDP for Fullsend commands intended for this repository.
#
# Fullsend resolves the command author's Jira role in RHIDP.
# Only /fs-triage and /fs-code are registered for
# Jira dispatch; other Fullsend commands remain out of scope.

name: fullsend Jira poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  poll:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: fullsend-jira-poll
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_dispatches: ${{ steps.build-matrix.outputs.has_dispatches }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install fullsend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.57.1 --repo fullsend-ai/fullsend \
            -p 'fullsend_0.57.1_linux_amd64.tar.gz' -O - | tar xz
          sudo mv fullsend /usr/local/bin/
          fullsend --version

      - name: Poll Jira
        env:
          FULLSEND_JIRA_TOKEN: ${{ secrets.FULLSEND_JIRA_TOKEN || secrets.JIRA_TOKEN }}
          FULLSEND_JIRA_EMAIL: ${{ secrets.FULLSEND_JIRA_EMAIL || secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${JIRA_BASE_URL}" ]]; then
            echo "::error::JIRA_BASE_URL variable is empty (must be an Actions variable, not a secret)"
            exit 1
          fi
          if [[ -z "${FULLSEND_JIRA_TOKEN}" || -z "${FULLSEND_JIRA_EMAIL}" ]]; then
            echo "::error::Configure a Jira API token and email in Actions secrets"
            exit 1
          fi

          # Render the per-team poll config only in this checkout.
          poll_config=.fullsend/config.yaml
          poll_base=$(mktemp)
          cp "$poll_config" "$poll_base"
          trap 'cp "$poll_base" "$poll_config"; rm -f "$poll_base"' EXIT

          poll_project() {
            local project="$1"
            local team_id="$2"
            local slug="$3"
            local output="dispatches-${project,,}-${slug,,}.json"
            local stamped
            # Keep each gate explicit. To enroll another team, add one
            # poll_project call below with its Atlassian team ID and a slug.
            # The slug keeps two polls of the same project from sharing one file.
            local jql="cf[10001] = \"${team_id}\" AND labels = \"fullsend\" AND statusCategory != Done AND updated >= \"-1h\" ORDER BY updated DESC"
            echo "Polling ${project} for team ${team_id}; dispatching matches to ${TARGET_REPO}"
            JIRA_POLL_PROJECT="$project" JIRA_POLL_QUERY="$jql" yq '
              .tracker = {"jira": {"base_url": strenv(JIRA_BASE_URL), "project": strenv(JIRA_POLL_PROJECT), "poll": {"enabled": true, "query": strenv(JIRA_POLL_QUERY)}}}
              | .authorization = (((.authorization // []) + [{"provider": "jira", "labels": "project_roles"}]) | unique_by(.provider))
            ' "$poll_base" > "$poll_config"
            fullsend poll \
              --input-driver jira-poll \
              --mode slash \
              --target-repo "${TARGET_REPO}" \
              --output "${output}" \
              --fullsend-dir .fullsend
            if [[ ! -f "${output}" ]]; then
              echo '[]' > "${output}"
            fi
            # plugins-code.yaml matches cf[10001]. Stamp the id this call polled.
            stamped="$(mktemp)"
            jq --arg team "${team_id}" 'map(. + {"cf[10001]": $team})' "${output}" > "${stamped}"
            mv "${stamped}" "${output}"
          }

          # Jira Team "RHDH AI" uses this Atlassian ID in cf[10001], not its display name.
          RHDH_AI_TEAM_ID='ec74d716-af36-4b3c-950f-f79213d08f71-1087'
          poll_project RHIDP "${RHDH_AI_TEAM_ID}" ai

          # Jira Team "Plugins" uses this Atlassian ID in cf[10001], not its display name.
          RHDH_PLUGINS_TEAM_ID='ec74d716-af36-4b3c-950f-f79213d08f71-2366'
          poll_project RHIDP "${RHDH_PLUGINS_TEAM_ID}" plugins

          jq -s 'add' dispatches-*.json > dispatches.json
          echo "Dispatch count: $(jq 'length' dispatches.json)"
          jq -c '.[] | {agent, event_type, status_number, team: .["cf[10001]"]}' dispatches.json || true

      - name: Upload dispatches
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dispatches
          path: |
            dispatches.json
            dispatches-*.json
          if-no-files-found: ignore

      - name: Build dispatch matrix
        id: build-matrix
        run: |
          set -euo pipefail
          if [[ ! -f dispatches.json ]] || ! jq -e 'length > 0' dispatches.json > /dev/null 2>&1; then
            echo "No dispatches."
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            echo "has_dispatches=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MATRIX=$(jq -c '{include: .}' dispatches.json)
          DELIM="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${DELIM}"
            printf '%s' "${MATRIX}"
            echo
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"
          echo "has_dispatches=true" >> "${GITHUB_OUTPUT}"

  harness:
    name: Harness
    needs: poll
    if: needs.poll.outputs.has_dispatches == 'true'
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@d11de3ea0dde5aa652110b6716c19e000c426df7 # v0.57.1
    with:
      matrix: ${{ needs.poll.outputs.matrix }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      FULLSEND_JIRA_TOKEN: ${{ secrets.FULLSEND_JIRA_TOKEN || secrets.JIRA_TOKEN }}
      FULLSEND_JIRA_EMAIL: ${{ secrets.FULLSEND_JIRA_EMAIL || secrets.JIRA_USER_EMAIL }}
