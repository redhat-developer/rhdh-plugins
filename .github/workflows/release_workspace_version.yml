name: Prior Version Release Workspace

on:
  pull_request:
    types:
      - closed
    branches:
      - 'release-1.*/*'
      - 'release-*.*'

jobs:
  check-merged-pr:
    name: Classify prior-version release PR
    runs-on: ubuntu-latest
    outputs:
      is_version_pr: ${{ steps.check_pr.outputs.is_version_pr }}
      is_merged: ${{ steps.check_pr.outputs.is_merged }}
      is_repository_release: ${{ steps.classify_branch.outputs.is_repository_release }}
      is_supported_branch: ${{ steps.classify_branch.outputs.is_supported_branch }}
      workspace_name: ${{ steps.extract_workspace.outputs.workspace_name }}
      version_branch_id: ${{ steps.extract_workspace.outputs.version_branch_id }}
    steps:
      - name: Check PR title, author, branch and merged status
        id: check_pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          USER_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$PR_MERGED" == "true" ]]; then
            echo "is_merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_merged=false" >> "$GITHUB_OUTPUT"
          fi

          is_version_pr=false
          if [[ "$PR_TITLE" == "Version Packages"* \
            && "$USER_LOGIN" == "rhdh-bot" \
            && "$PR_MERGED" == "true" ]]; then
            if [[ "$BASE_REF" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
              if [[ "$HEAD_REF" =~ ^maintenance-changesets-release/${BASE_REF}/[^/]+$ ]]; then
                is_version_pr=true
              fi
            elif [[ "$BASE_REF" =~ ^release-1\.[0-9]+/[^/]+$ ]]; then
              if [[ "$HEAD_REF" == "maintenance-changesets-release/$BASE_REF" ]]; then
                is_version_pr=true
              fi
            fi
          fi
          echo "is_version_pr=$is_version_pr" >> "$GITHUB_OUTPUT"

      - name: Classify target branch
        id: classify_branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_REF" =~ ^release-([0-9]+)\.[0-9]+$ ]]; then
            RELEASE_MAJOR="${BASH_REMATCH[1]}"
            if (( RELEASE_MAJOR >= 2 )); then
              echo "is_repository_release=true" >> "$GITHUB_OUTPUT"
              echo "is_supported_branch=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Release workflow classification::$BASE_REF uses the repository-wide release path."
            else
              echo "is_repository_release=false" >> "$GITHUB_OUTPUT"
              echo "is_supported_branch=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Release workflow skipped::$BASE_REF is not a supported 1.x per-workspace branch or 2.x+ repository-wide branch. Use release-1.x/<workspace> for legacy releases."
            fi
          elif [[ "$BASE_REF" =~ ^release-1\.[0-9]+/[^/]+$ ]]; then
            echo "is_repository_release=false" >> "$GITHUB_OUTPUT"
            echo "is_supported_branch=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release workflow classification::$BASE_REF uses the legacy per-workspace release path."
          else
            echo "is_repository_release=false" >> "$GITHUB_OUTPUT"
            echo "is_supported_branch=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release workflow skipped::$BASE_REF does not match release-1.x/<workspace> or release-2.x+."
          fi

      - name: Extract workspace name from branch
        id: extract_workspace
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BASE_REF" =~ ^release-1\.[0-9]+/[^/]+$ ]]; then
            WORKSPACE_NAME=$(echo "$BASE_REF" | cut -d'/' -f2)
            VERSION_BRANCH_ID="$BASE_REF"
          elif [[ "$BASE_REF" =~ ^release-[0-9]+\.[0-9]+$ && "$HEAD_REF" =~ ^maintenance-changesets-release/${BASE_REF}/[^/]+$ ]]; then
            WORKSPACE_NAME=$(echo "$HEAD_REF" | cut -d'/' -f3)
            VERSION_BRANCH_ID="$BASE_REF/$WORKSPACE_NAME"
          else
            WORKSPACE_NAME=""
            VERSION_BRANCH_ID=""
          fi
          echo "workspace_name=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"
          echo "version_branch_id=$VERSION_BRANCH_ID" >> "$GITHUB_OUTPUT"
          if [[ -n "$WORKSPACE_NAME" ]]; then
            echo "::notice title=Release workspace::$WORKSPACE_NAME (version branch ID: $VERSION_BRANCH_ID)"
          else
            echo "::warning title=Release workspace unavailable::Could not derive a workspace from base '$BASE_REF' and head '$HEAD_REF'. Release jobs will be skipped."
          fi

  changesets-pr:
    name: LEGACY - Update Version Packages PR
    runs-on: ubuntu-latest
    needs: check-merged-pr
    if: needs.check-merged-pr.outputs.is_supported_branch == 'true' && needs.check-merged-pr.outputs.is_version_pr == 'false' && needs.check-merged-pr.outputs.is_repository_release == 'false' && needs.check-merged-pr.outputs.is_merged == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    defaults:
      run:
        working-directory: ./workspaces/${{ needs.check-merged-pr.outputs.workspace_name }}
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      needs_release: ${{ steps.release_check.outputs.needs_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Verify maintenance-changesets-release branch does not exist
        env:
          VERSION_BRANCH_ID: ${{ needs.check-merged-pr.outputs.version_branch_id }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/maintenance-changesets-release/$VERSION_BRANCH_ID"; then
            echo "Error: maintenance-changesets-release/$VERSION_BRANCH_ID branch already exists. Please clean up the branch before proceeding."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles(format('workspaces/${0}/**/yarn.lock', needs.check-merged-pr.outputs.workspace_name)) }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: yarn install
        run: yarn install --immutable

      - name: Fetch previous commit for release check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch origin "$BASE_SHA"

      - name: Fetch the commit that triggered the workflow (used by backstage/changesets-action)
        run: git fetch origin "$GITHUB_SHA"
        continue-on-error: true

      - name: Check if release
        id: release_check
        run: |
          yarn install
          node scripts/ci/check-if-release.js
        working-directory: ./
        env:
          WORKSPACE_NAME: ${{ needs.check-merged-pr.outputs.workspace_name }}
          COMMIT_SHA_BEFORE: '${{ github.event.pull_request.base.sha }}'
          TARGET_BRANCH: ${{ github.ref }}

      - name: Update Version Packages (${{ needs.check-merged-pr.outputs.workspace_name }}) PR
        id: changesets-pr
        if: steps.release_check.outputs.needs_release != 'true'
        uses: backstage/changesets-action@a39baf18913e669734ffb00c2fd9900472cfa240 # v2.3.2
        with:
          title: Version Packages (${{ needs.check-merged-pr.outputs.workspace_name }})
          cwd: workspaces/${{ needs.check-merged-pr.outputs.workspace_name }}
          version: yarn changeset version
          versionBranch: maintenance-changesets-release/${{ needs.check-merged-pr.outputs.version_branch_id }}
          skipRootChangelogUpdate: true
        env:
          GITHUB_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}

  repository-release-workspaces:
    name: Find changed workspaces
    runs-on: ubuntu-latest
    needs: check-merged-pr
    if: needs.check-merged-pr.outputs.is_supported_branch == 'true' && needs.check-merged-pr.outputs.is_repository_release == 'true' && needs.check-merged-pr.outputs.is_version_pr == 'false' && needs.check-merged-pr.outputs.is_merged == 'true'
    outputs:
      workspaces: ${{ steps.find-workspaces.outputs.workspaces }}
    steps:
      - name: Checkout merged PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Find changed workspaces
        id: find-workspaces
        run: node scripts/ci/list-workspaces-with-changes.js
        env:
          COMMIT_SHA_BEFORE: ${{ github.event.pull_request.base.sha }}
          INCLUDE_NOOP: 'false'

  repository-changesets-pr:
    name: Update Version Packages PR
    runs-on: ubuntu-latest
    needs:
      - check-merged-pr
      - repository-release-workspaces
    if: needs.repository-release-workspaces.outputs.workspaces != '[]'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref }}-${{ matrix.workspace }}
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.repository-release-workspaces.outputs.workspaces) }}
    defaults:
      run:
        working-directory: ./workspaces/${{ matrix.workspace }}
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout merged PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Verify maintenance-changesets-release branch does not exist
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          VERSION_BRANCH_ID="$RELEASE_BRANCH/$WORKSPACE"
          if git ls-remote --exit-code origin "refs/heads/maintenance-changesets-release/$VERSION_BRANCH_ID"; then
            echo "Error: maintenance-changesets-release/$VERSION_BRANCH_ID branch already exists. Please clean up the branch before proceeding."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles(format('workspaces/${0}/**/yarn.lock', matrix.workspace)) }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: yarn install
        run: yarn install --immutable

      - name: Fetch previous commit for release check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch origin "$BASE_SHA"

      - name: Check if release
        id: release_check
        run: |
          yarn install
          node scripts/ci/check-if-release.js
        working-directory: ./
        env:
          WORKSPACE_NAME: ${{ matrix.workspace }}
          COMMIT_SHA_BEFORE: '${{ github.event.pull_request.base.sha }}'
          TARGET_BRANCH: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Update Version Packages (${{ matrix.workspace }}) PR
        if: steps.release_check.outputs.needs_release != 'true'
        uses: backstage/changesets-action@a39baf18913e669734ffb00c2fd9900472cfa240 # v2.3.2
        with:
          title: Version Packages (${{ matrix.workspace }})
          cwd: workspaces/${{ matrix.workspace }}
          version: yarn changeset version
          versionBranch: maintenance-changesets-release/${{ github.event.pull_request.base.ref }}/${{ matrix.workspace }}
          skipRootChangelogUpdate: true
        env:
          GITHUB_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}

  release:
    name: LEGACY - Publish legacy workspace
    runs-on: ubuntu-latest
    needs: check-merged-pr
    if: needs.check-merged-pr.outputs.is_supported_branch == 'true' && needs.check-merged-pr.outputs.is_version_pr == 'true' && needs.check-merged-pr.outputs.is_repository_release == 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    defaults:
      run:
        working-directory: ./workspaces/${{ needs.check-merged-pr.outputs.workspace_name }}
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: Install root dependencies
        run: yarn install --immutable
        working-directory: ${{ github.workspace }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles(format('workspaces/${0}/**/yarn.lock', needs.check-merged-pr.outputs.workspace_name)) }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: yarn install
        run: yarn install --immutable

      - name: Compile TypeScript
        run: yarn tsc:full

      - name: Build all packages
        run: yarn build:all

      - name: publish
        run: |
          yarn config set -H 'npmAuthToken' "$NODE_AUTH_TOKEN"
          yarn workspaces foreach -A -v --no-private npm publish --access public --tolerate-republish --tag "maintenance"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RHDH_NPM_TOKEN }}

      - name: Create tag
        working-directory: ${{ github.workspace }}/scripts/ci
        run: node create-tag.js
        env:
          WORKSPACE_NAME: ${{ needs.check-merged-pr.outputs.workspace_name }}
          GITHUB_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}

  repository-release:
    name: Publish workspace
    runs-on: ubuntu-latest
    needs:
      - check-merged-pr
    if: needs.check-merged-pr.outputs.is_supported_branch == 'true' && needs.check-merged-pr.outputs.is_version_pr == 'true' && needs.check-merged-pr.outputs.is_repository_release == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref }}-${{ needs.check-merged-pr.outputs.workspace_name }}
    defaults:
      run:
        working-directory: ./workspaces/${{ needs.check-merged-pr.outputs.workspace_name }}
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout merged Version Packages PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: Install root dependencies
        run: yarn install --immutable
        working-directory: ${{ github.workspace }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles(format('workspaces/${0}/**/yarn.lock', needs.check-merged-pr.outputs.workspace_name)) }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: yarn install
        run: yarn install --immutable

      - name: Compile TypeScript
        run: yarn tsc:full

      - name: Build all packages
        run: yarn build:all

      - name: publish
        run: |
          yarn config set -H 'npmAuthToken' "$NODE_AUTH_TOKEN"
          yarn workspaces foreach -A -v --no-private npm publish --access public --tolerate-republish --tag "maintenance"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RHDH_NPM_TOKEN }}

      - name: Create tag
        working-directory: ${{ github.workspace }}/scripts/ci
        run: node create-tag.js
        env:
          WORKSPACE_NAME: ${{ needs.check-merged-pr.outputs.workspace_name }}
          GITHUB_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
