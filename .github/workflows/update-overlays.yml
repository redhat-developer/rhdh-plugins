name: Update overlays after release

on:
  workflow_call:
    inputs:
      workspace:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      RHDH_BOT_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: update-overlays-${{ inputs.branch }}-${{ inputs.workspace }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'redhat-developer/rhdh-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Trigger overlays update and link its PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          WORKSPACE_NAME: ${{ inputs.workspace }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        with:
          github-token: ${{ secrets.RHDH_BOT_TOKEN }}
          script: |
            const { updateOverlays } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/update-overlays.js`
            );
            await updateOverlays({
              github, context, core,
              workspace: process.env.WORKSPACE_NAME,
              branch: process.env.RELEASE_BRANCH,
            });
