name: Fullsend CI triage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed CI workflow run ID to replay
        required: true
        type: string
      pr_number:
        description: Optional PR number; must match the run head
        required: false
        type: string
      dry_run:
        description: Validate and summarize without commenting or dispatching
        required: true
        default: true
        type: boolean

concurrency:
  group: >-
    fullsend-ci-triage-${{
      github.event.workflow_run.pull_requests[0].number
      || github.event.workflow_run.head_branch
      || inputs.pr_number
      || inputs.run_id
    }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Validate CI failure and build triage matrix
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      matrix: ${{ steps.intake.outputs.matrix }}
      pr_number: ${{ steps.intake.outputs.pr_number }}
      head_sha: ${{ steps.intake.outputs.head_sha }}
    steps:
      - name: Resolve run, PR, failures, and trust context
        id: intake
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FULLSEND_CI_RUN_ID: ${{ inputs.run_id }}
          FULLSEND_CI_PR_NUMBER: ${{ inputs.pr_number }}
          FULLSEND_CI_DRY_RUN: ${{ inputs.dry_run || false }}
          FULLSEND_CI_AUTOMATION: ${{ vars.FULLSEND_CI_AUTOMATION || 'observe' }}
          FULLSEND_CI_AUTOFIX_WORKSPACES: ${{ vars.FULLSEND_CI_AUTOFIX_WORKSPACES || 'boost,scorecard,ai-integrations' }}
        with:
          script: |
            // This privileged workflow never checks out a PR or fork. Fetch
            // the helper as a file from the upstream default branch only.
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'scripts/ci/fullsend-ci-context.cjs',
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(response.data) || response.data.type !== 'file') {
              throw new Error('Trusted CI helper is not a regular file');
            }
            const helperPath = path.join(os.tmpdir(), 'fullsend-ci-context.cjs');
            fs.writeFileSync(
              helperPath,
              Buffer.from(response.data.content, response.data.encoding),
              { mode: 0o600 },
            );
            const intake = require(helperPath);
            await intake.prepareIntake({github, context, core, env: process.env});

  triage:
    name: Run read-only CI triage agent
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '' && needs.prepare.outputs.matrix != '{"include":[]}' }}
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@84c8bbbb821ff85136854150b06740253709b3b8 # v0.37.0
    with:
      event_action: ci_failure
      install_mode: per-repo
      matrix: ${{ needs.prepare.outputs.matrix }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
