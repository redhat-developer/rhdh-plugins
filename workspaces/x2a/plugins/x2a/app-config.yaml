dynamicPlugins:
  frontend:
    red-hat-developer-hub.backstage-plugin-x2a:
      scaffolderFieldExtensions:
        - importName: RepoAuthenticationExtension
        - importName: RulesAcceptanceExtension
        - importName: X2ARepoUrlPickerExtension
      translationResources:
        - importName: x2aPluginTranslations
          ref: x2aPluginTranslationRef
      appIcons:
        - name: x2aIcon
          importName: X2AIcon
      dynamicRoutes:
        - path: /x2a
          importName: X2APage
          menuItem:
            icon: x2aIcon
            text: X2Ansible

# Required for repository authentication (GitHub, GitLab): the one host each SCM
# OAuth provider is registered against. Must match `auth.providers.gitlab.<env>.audience`
# and `auth.providers.github.<env>.enterpriseInstanceUrl` (github.com when unset).
# There is no default; an unset key refuses every host of that type.
# x2a:
#   scm:
#     authHosts:
#       github: github.com
#       gitlab: gitlab.example.com
