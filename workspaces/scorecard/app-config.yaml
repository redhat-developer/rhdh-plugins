app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000
  packages: all
  extensions:
    - api:app/app-language:
        config:
          availableLanguages: ['en', 'de', 'fr', 'it', 'es', 'ja']
          defaultLanguage: 'en'
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - page:home:
        config:
          path: /

    # Scorecard tab: entity shows tab if it matches any filter below.
    - entity-content:scorecard/entity-content-scorecard:
        config:
          allowedFilters:
            - kind: component # e.g. Component with spec.type: website
              type: website
            - kind: api # e.g. any API entity
            - type: service # e.g. Component or System with spec.type: service

    # Grid layout – enabled with metric grouping
    - scorecard-layout:scorecard/scorecard-entity-layout-grid:
        disabled: false
        config:
          groups:
            security-vulnerabilities:
              title: Security Vulnerabilities
              description: Track security issues across your repositories
              metrics:
                - sonarqube.securityRating

            code-quality:
              title: Code Quality
              description: Code quality and maintainability metrics
              metrics:
                - sonarqube.qualityGate
                - sonarqube.codeCoverage
                - sonarqube.maintainabilityRating

            sonarqube-coverage:
              title: SonarQube Coverage
              description: SonarQube coverage metrics
              metrics:
                - sonarqube.openIssues
                - sonarqube.securityHotspots
                - sonarqube.securityRating

    - home-page-layout:home/dynamic-homepage-layout:
        config:
          customizable: true
          widgetLayout:
            AggregatedCardWithDeprecatedMetricId:
              priority: 410
              breakpoints:
                xl: { w: 4, h: 6 }
                lg: { w: 4, h: 6 }
                md: { w: 4, h: 6 }
                sm: { w: 4, h: 6 }
                xs: { w: 4, h: 6 }
                xxs: { w: 4, h: 6 }

            AggregatedCardWithDefaultAggregation:
              priority: 420
              breakpoints:
                xl: { w: 4, h: 6, x: 4 }
                lg: { w: 4, h: 6, x: 4 }
                md: { w: 4, h: 6, x: 4 }
                sm: { w: 4, h: 6, x: 4 }
                xs: { w: 4, h: 6, x: 4 }
                xxs: { w: 4, h: 6, x: 4 }

            AggregatedCardWithJiraOpenIssues:
              priority: 430
              breakpoints:
                xl: { w: 4, h: 6 }
                lg: { w: 4, h: 6 }
                md: { w: 4, h: 6 }
                sm: { w: 4, h: 6 }
                xs: { w: 4, h: 6 }
                xxs: { w: 4, h: 6 }

            AggregatedCardWithGithubOpenPrs:
              priority: 440
              breakpoints:
                xl: { w: 4, h: 6, x: 4 }
                lg: { w: 4, h: 6, x: 4 }
                md: { w: 4, h: 6, x: 4 }
                sm: { w: 4, h: 6, x: 4 }
                xs: { w: 4, h: 6, x: 4 }
                xxs: { w: 4, h: 6, x: 4 }
            AggregatedCardWithGithubFilecheckLicense:
              priority: 450
              breakpoints:
                xl: { w: 4, h: 6 }
                lg: { w: 4, h: 6 }
                md: { w: 4, h: 6 }
                sm: { w: 4, h: 6 }
                xs: { w: 4, h: 6 }
                xxs: { w: 4, h: 6 }
            AggregatedCardWithGithubFilecheckCodeowners:
              priority: 460
              breakpoints:
                xl: { w: 4, h: 6, x: 8 }
                lg: { w: 4, h: 6, x: 8 }
                md: { w: 4, h: 6, x: 8 }
                sm: { w: 4, h: 6, x: 8 }
                xs: { w: 4, h: 6, x: 8 }
                xxs: { w: 4, h: 6, x: 8 }
            AggregatedCardWithGithubOpenPrsWeighted:
