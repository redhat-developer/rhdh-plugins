organization:
  name: My Company

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

  # Uncomment this when MCP Actions are needed
  # actions:
  #   pluginSources:
  #     - 'scorecard'
  # auth:
  #   externalAccess:
  #     - type: static
  #       options:
  #         token: ${MCP_TOKEN}
  #         subject: mcp-clients

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  '/jira/api':
    target: ${JIRA_URL}
    headers:
      Authorization: ${JIRA_TOKEN}
      Accept: 'application/json'
      Content-Type: 'application/json'
      X-Atlassian-Token: 'nocheck'
      User-Agent: 'MY-UA-STRING'

# Jira plugin and scorecard configuration
jira:
  # Proxy Jira configuration
  # Supported products: `cloud` or `datacenter`
  # product: cloud
  # proxyPath: /jira/api

  # Direct Jira configuration
  # Supported products: `cloud` or `datacenter`
  product: cloud
  baseUrl: ${JIRA_URL}
  token: ${JIRA_TOKEN}

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, Group, Resource, Location, Template, API]
  locations:
    - type: file
      target: ../../examples/all-scorecards-location.yaml
      rules:
        - allow: [Component]
    - type: file
      target: ../../examples/orgs/guest.yaml
      rules:
        - allow: [User, Group]
    - type: url
      target: https://github.com/redhat-developer/rhdh/blob/main/catalog-entities/components/showcase.yaml

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true
  rbac:
    pluginsWithPermission:
      - catalog
      - permission
      - scaffolder
      - scorecard
    admin:
      users:
        - name: user:development/guest

# SonarQube configuration (optional - defaults to https://sonarcloud.io, no auth for public projects)
sonarqube:
  baseUrl: https://sonarcloud.io
  apiKey: ${SONARQUBE_TOKEN}
  instances:
    - name: internal
      baseUrl: https://sonarcloud.io
      apiKey: ${SONARQUBE_INTERNAL_KEY}
      authType: Basic # optional, defaults to Basic
    - name: cloud
      baseUrl: https://sonarcloud.io

# Scorecard development configuration
scorecard:
  aggregationKPIs:
    openPrsKpi:
      title: GitHub Open PRs KPI
      type: statusGrouped
      description: This KPI provides information about GitHub open PRs grouped by status.
      metricId: github.openPRs
    openPrsWeightedKpi:
      title: GitHub Open PRs KPI (weighted health)
      type: weightedStatusScore
      description: This KPI provides a weighted health score for open PRs by threshold status across your entities.
      metricId: github.openPRs
      options:
        statusScores:
          success: 100
          warning: 40
          error: 0
        thresholds:
          rules:
            - key: success
              expression: '>=80'
              color: '#6bb300' # green
            - key: warning
              expression: '30-80'
              color: 'rgb(224, 189, 108)' # light orange
            - key: error
              expression: '<30'
              color: '#be1ec7' # purple
    openIssuesKpi:
      title: Jira Open Issues KPI
      type: statusGrouped
      description: This KPI provides information about Jira open issues grouped by status.
      metricId: jira.openIssues
    licenseFileExistsKpi:
      title: License File Exists KPI
      type: statusGrouped
      description: This KPI provides information about whether the license file exists in the repository.
      metricId: filecheck.license
    totalCriticalPRs:
      title: Total Critical PRs
      description: This KPI provides a sum of open PRs for entities in error status.
      type: sum
      metricId: github.openPRs
      filter:
        status: error
      options:
        thresholds:
          rules:
            - key: success
              expression: '<30'
              color: '#6bb300'
            - key: warning
              expression: '30-80'
              color: 'rgb(224, 189, 108)'
            - key: error
              expression: '>80'
              color: '#be1ec7'
    avgOpenIssues:
      title: Average Open Issues
      description: This KPI provides a mean open issues count per entity.
      type: average
      metricId: jira.openIssues
    entitiesWithOpenPrs:
      title: Entities with Open PRs
      description: This KPI provides a count of entities with a stored open-prs value.
      type: count
      metricId: github.openPRs
    maxOpenPrs:
      title: Maximum Open PRs
      description: This KPI provides a maximum open PR count per entity.
      type: max
      metricId: github.openPRs
    minOpenIssues:
      title: Minimum Open Issues
      description: This KPI provides a minimum open issues count per entity.
      type: min
      metricId: jira.openIssues
    minOpenPrs:
      title: Minimum Open PRs
      description: Lowest open PR count among owned entities.
      type: min
      metricId: github.openPRs
    avgOpenPrs:
      title: Average Open PRs
      description: Mean open PR count per entity.
      type: average
      metricId: github.openPRs
    totalOpenBugs:
      title: Total Open Bugs
      description: Sum of open issues across owned entities.
      type: sum
      metricId: jira.openIssues
      options:
        thresholds:
          rules:
            - key: success
              expression: '<30'
              color: '#6bb300'
            - key: warning
              expression: '30-80'
              color: 'rgb(224, 189, 108)'
            - key: error
              expression: '>80'
              color: '#be1ec7'

  # Globally disabled metrics — these checks never run, regardless of entity annotations.
  # disabledMetrics:
  #   - openssf.packaging

  # Control whether entity annotations can override scorecard behavior.
  # entityAnnotations:
  #   # Global switch: if false, all scorecard entity annotations are ignored. Default: true.
  #   enabled: true
  #   # Per-entity threshold override annotations (scorecard.io/<metricId>.thresholds.rules.<key>).
  #   thresholds:
  #     # If true (default), entities can customize thresholds via annotations
  #     # for metrics not listed in `except`; if false, threshold annotations have no effect.
  #     enabled: true
  #     # Metric IDs listed here cannot have their thresholds customized via entity annotations.
  #     except:
  #       - github.openPRs
  #   # Per-entity disabled-metrics annotation (scorecard.io/disabled-metrics).
  #   disabledMetrics:
  #     # If true (default), entities can disable metrics via annotation
  #     # for metrics not listed in `except`; if false, the annotation has no effect.
  #     enabled: true
  #     # Entity annotations cannot disable metric IDs listed here
  #     # (these checks always run unless mentioned in scorecard.disabledMetrics).
  #     except:
  #       - openssf.maintained

  metricProviders:
    jira:
      openIssues:
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
    github:
      openPRs:
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
    catalog:
      requiredAttributes:
        options:
          filter:
            kind: Component
            metadata.annotations.scorecard/example: catalog
          metrics:
            title:
              title: Title is required
              description: Every component should have a human-readable title.
              field: metadata.title
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
    filecheck:
      fileExistence:
        options:
          files:
            license: 'LICENSE'
            codeowners: 'CODEOWNERS'
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
    dora:
      deploymentFrequency:
        options:
          collectors:
            deployments:
              id: github:deployments
              # Uncomment the following to use workflow runs
              # id: github:deploymentWorkflowRuns
              # input:
              #   workflowName: Create Test Deployment on PR Merge
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
      medianLeadTimeForChanges:
        options:
          collectors:
            deployments:
              id: github:deployments
              # Uncomment the following to use workflow runs
              # id: github:deploymentWorkflowRuns
              # input:
              #   workflowName: Create Test Deployment on PR Merge
            deploymentPullRequests:
              id: github:deploymentPullRequests
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
      changeFailureRate:
        options:
          collectors:
            deployments:
              id: github:deployments
              # Uncomment the following to use workflow runs
              # id: github:deploymentWorkflowRuns
              # input:
              #   workflowName: Create Test Deployment on PR Merge
            incidents:
              id: jira:incidents
              # Optional: override default Incident issue type
              # input:
              #   issueType: ServiceIncident
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
      meanTimeToRestore:
        options:
          collectors:
            incidents:
              id: jira:incidents
              # Optional: override default Incident issue type
              # input:
              #   issueType: ServiceIncident
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 10 }
