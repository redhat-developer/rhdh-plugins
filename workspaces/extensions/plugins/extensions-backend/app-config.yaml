app:
  title: Extensions backend dev
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  auth:
    # Dev-only static token for curl. Do not use in production.
    # Export BACKSTAGE_DEV_STATIC_TOKEN (min 8 chars) before starting the harness.
    # See CONTRIBUTING.md.
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_DEV_STATIC_TOKEN}
          subject: extensions-dev
