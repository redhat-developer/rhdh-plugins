# please keep this in sync with packages/app-legacy mount points
# Note: Legacy/OFS exports are only available from `module: Legacy`.
# The default module (PluginRoot) is NFS-only.
dynamicPlugins:
  frontend:
    red-hat-developer-hub.backstage-plugin-homepage:
      translationResources:
        - importName: homepageTranslations
          module: Legacy
          ref: homepageTranslationRef
      dynamicRoutes:
        - path: /
          importName: DynamicHomePage
          module: Legacy
      mountPoints:
        # Default homepage cards - appear by default
        - mountPoint: home.page/cards
          importName: OnboardingSection
          module: Legacy
          config:
            layouts:
              xl: { w: 12, h: 6 }
              lg: { w: 12, h: 6 }
              md: { w: 12, h: 7 }
              sm: { w: 12, h: 8 }
              xs: { w: 12, h: 9 }
              xxs: { w: 12, h: 14 }
        - mountPoint: home.page/cards
          importName: EntitySection
          module: Legacy
          config:
            layouts:
              xl: { w: 12, h: 7 }
              lg: { w: 12, h: 7 }
              md: { w: 12, h: 8 }
              sm: { w: 12, h: 9 }
              xs: { w: 12, h: 11 }
              xxs: { w: 12, h: 15 }
        - mountPoint: home.page/cards
          importName: TemplateSection
          module: Legacy
          config:
            layouts:
              xl: { w: 12, h: 5 }
              lg: { w: 12, h: 5 }
              md: { w: 12, h: 5 }
              sm: { w: 12, h: 5 }
              xs: { w: 12, h: 7.5 }
              xxs: { w: 12, h: 13.5 }

        # Additional plugin widgets - available in "Add widget" dialog
        - mountPoint: home.page/widgets
          importName: RecentlyVisitedCard
          module: Legacy
          config:
            title: 'Recently Visited'
            description: 'Quick access to recently viewed entities and pages'
            priority: 2
            layouts:
              xl: { w: 4, h: 3 }
              lg: { w: 4, h: 3 }
              md: { w: 6, h: 3 }
              sm: { w: 12, h: 3 }
              xs: { w: 12, h: 3 }
              xxs: { w: 12, h: 3 }
        - mountPoint: home.page/widgets
          importName: TopVisitedCard
          module: Legacy
          config:
            title: 'Most Visited'
            description: 'Your most frequently accessed entities and services'
            priority: 1
            layouts:
              xl: { w: 4, h: 3 }
              lg: { w: 4, h: 3 }
              md: { w: 6, h: 3 }
              sm: { w: 12, h: 3 }
              xs: { w: 12, h: 3 }
              xxs: { w: 12, h: 3 }
