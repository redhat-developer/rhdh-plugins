# Shared homepage.defaultWidgets for unless / tags Playwright (real NFS widget refs).
# Loaded only by persona e2e overlays — does not change the base app-config.yaml.
#
# catalog.locations is re-listed because later --config files replace arrays.
catalog:
  locations:
    - type: file
      target: ../../catalog-info.yaml
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ../../e2e-tests/fixtures/org-e2e.yaml
      rules:
        - allow: [User, Group]

# Persona users are not RBAC admins. Without catalog.entity.read, homepage-backend
# cannot load their memberOf relations and all group if/unless rules fail closed.
permission:
  rbac:
    policies-csv-file: ../../e2e-tests/fixtures/rbac-policy-e2e.csv

homepage:
  defaultWidgets:
    - id: onboarding
      ref: rhdh-onboarding-section
      tags: [public]
      layout:
        xl: { w: 12, h: 6 }
        lg: { w: 12, h: 6 }
        md: { w: 12, h: 7 }
        sm: { w: 12, h: 8 }
        xs: { w: 12, h: 9 }
        xxs: { w: 12, h: 14 }
    - id: entity-list
      ref: rhdh-entity-section
      tags: [general]
      layout:
        xl: { w: 12, h: 7 }
        lg: { w: 12, h: 7 }
        md: { w: 12, h: 8 }
        sm: { w: 12, h: 9 }
        xs: { w: 12, h: 11 }
        xxs: { w: 12, h: 15 }
    - id: template-list
      ref: rhdh-template-section
      tags: [developer]
      layout:
        xl: { w: 12, h: 5 }
        lg: { w: 12, h: 5 }
        md: { w: 12, h: 5 }
        sm: { w: 12, h: 5 }
        xs: { w: 12, h: 7.5 }
        xxs: { w: 12, h: 13.5 }
    - id: quickaccess-card
      ref: quickaccess-card
      tags: [general]
      layout:
        xl: { w: 6, h: 8, x: 6 }
        lg: { w: 6, h: 8, x: 6 }
        md: { w: 6, h: 8, x: 6 }
        sm: { w: 12, h: 8, x: 6 }
        xs: { w: 12, h: 8, x: 6 }
        xxs: { w: 12, h: 8, x: 6 }

    # Admins: Featured Docs (tags allowed by conditional policy)
    - if:
        groups: [group:default/admins]
      children:
        - id: featured-docs-card
          ref: featured-docs-card
          tags: [general]
          layout:
            xl: { w: 6, h: 4 }
            lg: { w: 6, h: 4 }
            md: { w: 6, h: 4 }
            sm: { w: 12, h: 4 }
            xs: { w: 12, h: 4 }
            xxs: { w: 12, h: 4 }

    # Developers except developer-user (user-level unless)
    - if:
        groups: [group:default/developers]
      unless:
        users: [user:default/developer-user]
      children:
        - id: recently-visited-card
          ref: recently-visited-card
          tags: [developer]
          layout:
            xl: { w: 6, h: 4 }
            lg: { w: 6, h: 4 }
            md: { w: 6, h: 4 }
            sm: { w: 12, h: 4 }
            xs: { w: 12, h: 4 }
            xxs: { w: 12, h: 4 }
        - id: top-visited-card
          ref: top-visited-card
          tags: [developer]
          layout:
            xl: { w: 6, h: 4 }
            lg: { w: 6, h: 4 }
            md: { w: 6, h: 4 }
            sm: { w: 12, h: 4 }
            xs: { w: 12, h: 4 }
            xxs: { w: 12, h: 4 }

    # Developers see Starred unless also in admins (overlapping roles)
    - id: test-unless-overlap
      ref: catalog-starred-entities-card
      if:
        groups: [group:default/developers]
      unless:
        groups: [group:default/admins]
      tags: [developer]
      layout:
        xl: { w: 6, h: 4 }
        lg: { w: 6, h: 4 }
        md: { w: 6, h: 4 }
        sm: { w: 12, h: 4 }
        xs: { w: 12, h: 4 }
        xxs: { w: 12, h: 4 }

    # Everyone except admins
    - id: test-unless-group
      ref: search-bar
      unless:
        groups: [group:default/admins]
      tags: [general]
      layout:
        xl: { w: 12, h: 1 }
        lg: { w: 12, h: 1 }
        md: { w: 12, h: 1 }
        sm: { w: 12, h: 1 }
        xs: { w: 12, h: 1 }
        xxs: { w: 12, h: 1 }

    # Tagged admin — filtered by RBAC (policy allows public/general/developer only)
    - id: test-tagged-admin
      ref: featured-docs-card
      tags: [admin]
      layout:
        xl: { w: 6, h: 4 }
        lg: { w: 6, h: 4 }
        md: { w: 6, h: 4 }
        sm: { w: 12, h: 4 }
        xs: { w: 12, h: 4 }
        xxs: { w: 12, h: 4 }
