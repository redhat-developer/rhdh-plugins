app:
  title: DCM
  baseUrl: http://localhost:3000
  support:
    url: https://github.com/redhat-developer/rhdh-plugins/issues
    items:
      - title: Issues
        icon: github
        links:
          - url: https://github.com/redhat-developer/rhdh-plugins/issues
            title: GitHub Issues

organization:
  name: DCM

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

techdocs:
  builder: 'local'
  generator:
    runIn: 'docker'
  publisher:
    type: 'local'

auth:
  providers:
    # Local development only. Replace this with the OIDC provider below for
    # a deployed environment.
    guest: {}
    # oidc:
    #   production:
    #     metadataUrl: https://keycloak.example.com/realms/rhdh/.well-known/openid-configuration
    #     clientId: rhdh-auth
    #     clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
    #     prompt: auto

permission:
  enabled: true
  rbac:
    policyFileReload: true
    pluginsWithPermission:
      - catalog
      - scaffolder
      - permission
      - dcm
    admin:
      users:
        - name: group:default/admins
      superUsers:
        - name: group:default/admins

scaffolder: {}

dcm:
  # The standalone app uses the DCM control plane's auth-disabled mode.
  auth:
    enabled: false
  policyPacks:
    - security-baseline
    - compliance-pci
    - audit-logging
  # Base URL of the DCM control plane. All three API services (catalog,
  # policy-manager, providers) are routed through this single endpoint.
  # Override in app-config.local.yaml for local development.
  # apiUrl: https://your-control-plane.example.com
  #
  # Set auth.enabled to true only when the DCM control plane's auth.enabled is
  # also true. In that mode, configure an OIDC provider under auth.providers.
  # The normal RHDH Authorization header authenticates the request to this
  # backend, while the user's OIDC token is forwarded to DCM by the proxy.

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: ../../examples/entities.yaml
      rules:
        - allow: [Component, System, API, Resource, Location]
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
