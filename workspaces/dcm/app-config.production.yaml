app:
  baseUrl: ${APP_BASE_URL:-http://localhost:7007}

backend:
  baseUrl: ${APP_BASE_URL:-http://localhost:7007}
  listen: ':7007'
  cors:
    origin: ${APP_BASE_URL:-http://localhost:7007}
  database:
    client: better-sqlite3
    connection: ':memory:'

dcm:
  # Keep this aligned with the DCM control plane's auth.enabled setting.
  auth:
    enabled: ${DCM_AUTH_ENABLED:-false}
  # Base URL of the DCM control plane.
  apiUrl: ${DCM_API_URL:-}
  # Legacy env var; kept until deploy configs switch to DCM_API_URL.
  apiGatewayUrl: ${DCM_API_GATEWAY_URL:-}
  # These settings are used only by the separately permission-protected token
  # endpoint. Normal DCM UI proxy requests forward the signed-in user's OIDC
  # token and do not use this shared client-credentials flow.
  ssoBaseUrl: ${DCM_SSO_BASE_URL:-}
  clientId: ${DCM_CLIENT_ID:-}
  clientSecret: ${DCM_CLIENT_SECRET:-}

auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
      userEntityRef: user:default/guest

# Standalone/compose deployments use guest auth and do not need RBAC.
# Override with PERMISSION_ENABLED=true when configuring real OIDC + RBAC.
permission:
  enabled: ${PERMISSION_ENABLED:-false}
  # When PERMISSION_ENABLED=true, configure RBAC admin users and the list of
  # plugins with permission support. Example:
  # rbac:
  #   policyFileReload: true
  #   pluginsWithPermission:
  #     - catalog
  #     - scaffolder
  #     - permission
  #     - dcm
  #   admin:
  #     users:
  #       - name: group:default/admins
  #     superUsers:
  #       - name: group:default/admins

catalog:
  locations: []

techdocs:
  generator:
    runIn: local
